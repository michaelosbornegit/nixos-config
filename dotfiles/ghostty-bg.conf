# Colours for ~/.claude/ghostty-bg. Sourced as POSIX sh, so keep the quoting.
# Ghostty's own background is #f9f9f9 (Atom One Light theme).

BG_WORKING='#f3fbf3'    # Claude is busy -- tools, subagents, workflows
BG_IDLE='#fff7f9'       # turn finished, your move
BG_ATTENTION='#fff7f9'  # needs a permission decision or an answer
BG_DEFAULT='#f9f9f9'    # what `reset` restores

# Want a neutral terminal while Claude is merely idle, and rose only when it
# genuinely needs you? Set BG_IDLE='#f9f9f9' -- permission prompts and
# questions still go rose via BG_ATTENTION.
